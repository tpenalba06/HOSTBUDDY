name: Billing sync probe (temporary)

on:
  push:
    branches: [feat/guest-guide-v2-lot1]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    env:
      ENABLED: ${{ vars.HOSTBUDDY_BILLING_SYNC_TEST_ENABLED }}
      HOSTBUDDY_BILLING_SYNC_URL: ${{ vars.HOSTBUDDY_BILLING_SYNC_URL }}
      BILLING_SYNC_SECRET: ${{ secrets.BILLING_SYNC_SECRET }}
    steps:
      - name: Report safe configuration state
        shell: bash
        run: |
          set -eu
          echo "enabled=$([ "$ENABLED" = "true" ] && echo true || echo false)"
          echo "url_present=$([ -n "$HOSTBUDDY_BILLING_SYNC_URL" ] && echo true || echo false)"
          echo "secret_present=$([ -n "$BILLING_SYNC_SECRET" ] && echo true || echo false)"
          if [ "$ENABLED" = "true" ]; then
            test -n "$HOSTBUDDY_BILLING_SYNC_URL"
            test -n "$BILLING_SYNC_SECRET"
          fi

  sync:
    needs: preflight
    if: vars.HOSTBUDDY_BILLING_SYNC_TEST_ENABLED == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run one guarded TEST billing sync
        env:
          HOSTBUDDY_BILLING_SYNC_URL: ${{ vars.HOSTBUDDY_BILLING_SYNC_URL }}
          BILLING_SYNC_SECRET: ${{ secrets.BILLING_SYNC_SECRET }}
        run: node scripts/run-billing-sync.mjs
