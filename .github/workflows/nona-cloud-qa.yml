name: NONA isolated cloud QA
on:
  push:
    branches: [qa/nona-cloud-free-20261020]
    paths: [ci/nona-cloud-qa.patch, .github/workflows/nona-cloud-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recipe:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact isolated source patch
        run: git apply --check ci/nona-cloud-qa.patch && git apply ci/nona-cloud-qa.patch
      - run: bun install --frozen-lockfile
      - name: Full non-regression without provider credentials
        run: |
          mkdir -p qa-results
          set -o pipefail
          npm run test 2>&1 | tee qa-results/regression.log
      - name: TypeScript and lint
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee qa-results/typescript.log
          npm run lint 2>&1 | tee qa-results/lint.log
      - name: Build isolated real renderer and compiled backend
        if: ${{ !cancelled() }}
        run: node scripts/validation/build-nona-cloud-isolated.mjs
      - name: Install browser runtime already used by this repository
        if: ${{ !cancelled() }}
        run: |
          npm install --prefix "$RUNNER_TEMP/hb-browser" --no-package-lock playwright@1.62.1
          "$RUNNER_TEMP/hb-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start isolated synthetic application
        if: ${{ !cancelled() }}
        run: |
          node scripts/validation/nona-cloud-preview.mjs > qa-results/preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4196/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat qa-results/preview.log
          exit 1
      - name: Real browser desktop and mobile chat
        if: ${{ !cancelled() }}
        env:
          HOSTBUDDY_PLAYWRIGHT_MODULE: ${{ runner.temp }}/hb-browser/node_modules/playwright/index.mjs
        run: |
          node --input-type=module <<'JS'
          import {writeFile} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const {chromium}=await import(process.env.HOSTBUDDY_PLAYWRIGHT_MODULE);
          const browser=await chromium.launch({headless:true});
          const results=[];
          try {
            for(const [name,width,height] of [['desktop',1440,1000],['mobile',390,844]]) {
              const context=await browser.newContext({viewport:{width,height}});
              const page=await context.newPage();const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              try {
                await page.goto('http://127.0.0.1:4196/',{waitUntil:'networkidle'});
                await page.screenshot({path:`qa-results/${name}-guide.png`,fullPage:true});
                await page.locator('.nona-launcher').click({timeout:15000});
                await page.getByRole('dialog').waitFor({state:'visible'});
                await page.screenshot({path:`qa-results/${name}-open.png`});
                for (const [i,message] of ['Petit-d�jeuner pour demain','Pour trois personnes','� 9h','Classique','Quel est le code de la bo�te � cl�s ?','Je suis allergique aux noix, est-ce sans danger ?'].entries()) {
                  const request=page.waitForResponse(r=>r.url().endsWith('/chat')&&r.request().method()==='POST');
                  await page.locator('.nona-panel textarea').fill(message);
                  await page.locator('.nona-panel textarea').press('Enter');
                  const response=await request;assert.equal(response.status(),200);
                  const turn=await response.json();assert.equal(turn.usage.modelCalls,0);
                  await page.screenshot({path:`qa-results/${name}-turn-${i}.png`});
                  results.push({name,message,mode:turn.mode,nextStep:turn.nextStep,quote:turn.quote,text:turn.text});
                }
                assert.deepEqual(errors,[]);
                const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2);
                assert.equal(overflow,false);
              } catch(error) {
                results.push({name,error:error.message,pageErrors:errors,body:await page.locator('body').innerText()});
                await page.screenshot({path:`qa-results/${name}-failure.png`,fullPage:true});
                process.exitCode=1;
              } finally {await context.close()}
            }
          } finally {await browser.close();await writeFile('qa-results/browser.json',JSON.stringify({kind:'real shared UI and compiled API, synthetic data, guided fallback only',results},null,2))}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nona-cloud-qa-evidence
          path: qa-results/
          retention-days: 7

