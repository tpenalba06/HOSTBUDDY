name: Validate

on:
  pull_request:
  push:
    branches: [main, feat/guest-guide-v2-lot1]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: npm run lint
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
