# INERT TEMPLATE. Do not install in the public application repository.
# Install only after SQL TEST input/CA and free-quota protection are available.
name: Nona isolated TEST database and Auth backup
on:
  schedule:
    - cron: '11 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-test-database-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.event.repository.private == true && vars.NONA_ISOLATED_OPS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: nona-isolated-test
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tpenalba06/HOSTBUDDY
          ref: a8db699914c3c61a947f3e8fc9cdfce63061d70b
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official PostgreSQL 17 clients before private inputs
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main\n' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client-17
      - name: Validate tools before private inputs
        run: |
          python -m pip install -r scripts/ops/requirements.txt
          python - <<'PY'
          import importlib.util
          s = importlib.util.spec_from_file_location('database_backup', 'scripts/ops/database-backup.py')
          m = importlib.util.module_from_spec(s)
          s.loader.exec_module(m)
          try:
              m.clients()
          except Exception:
              raise SystemExit('PostgreSQL 17+ clients required before activation') from None
          print('PostgreSQL clients PASS')
          PY
      - name: Prepare approved PostgreSQL TEST input only
        env:
          NONA_TEST_DATABASE_JSON: ${{ secrets.NONA_TEST_DATABASE_JSON }}
          NONA_TEST_BACKUP_KEY_HEX: ${{ secrets.NONA_TEST_BACKUP_KEY_HEX }}
          NONA_TEST_DATABASE_CA_PEM: ${{ vars.NONA_TEST_DATABASE_CA_PEM }}
        run: |
          python - <<'PY'
          import os, pathlib
          private = pathlib.Path(os.environ['RUNNER_TEMP']) / 'nona-database-private'
          private.mkdir(mode=0o700)
          for name, variable in [('database.json','NONA_TEST_DATABASE_JSON'), ('backup.key','NONA_TEST_BACKUP_KEY_HEX'), ('database-ca.crt','NONA_TEST_DATABASE_CA_PEM')]:
              value = os.environ.get(variable, '')
              if not value: raise SystemExit('Missing approved TEST input')
              fd = os.open(private / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(fd, 'w') as f: f.write(value)
          PY
      - name: Read-only logical export and authenticated recheck
        run: |
          python scripts/ops/database-backup.py backup --expected-ref mhhtnqfdkyudwyqlmnce --connection-file "$RUNNER_TEMP/nona-database-private/database.json" --ca-file "$RUNNER_TEMP/nona-database-private/database-ca.crt" --key-file "$RUNNER_TEMP/nona-database-private/backup.key" --output "$RUNNER_TEMP/nona-database-private/database.nonaenc" --max-bytes 67108864
          python scripts/ops/database-backup.py verify --expected-ref mhhtnqfdkyudwyqlmnce --key-file "$RUNNER_TEMP/nona-database-private/backup.key" --output "$RUNNER_TEMP/nona-database-private/database.nonaenc"
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-test-database-${{ github.run_id }}
          path: ${{ runner.temp }}/nona-database-private/database.nonaenc
          retention-days: 7
          if-no-files-found: error
      - name: Retrieve this run ciphertext
        uses: actions/download-artifact@v4
        with:
          name: isolated-test-database-${{ github.run_id }}
          path: ${{ runner.temp }}/nona-database-retrieved
      - name: Verify retrieved ciphertext without a database connection
        run: |
          python scripts/ops/database-backup.py verify --expected-ref mhhtnqfdkyudwyqlmnce --key-file "$RUNNER_TEMP/nona-database-private/backup.key" --output "$RUNNER_TEMP/nona-database-retrieved/database.nonaenc"
      - name: Remove only this job private inputs
        if: always()
        run: |
          python - <<'PY'
          import os, pathlib
          private = pathlib.Path(os.environ['RUNNER_TEMP']) / 'nona-database-private'
          for name in ['database.json', 'backup.key', 'database-ca.crt']:
              (private / name).unlink(missing_ok=True)
          PY
# Only ciphertext is uploaded, after successful export and separate verification.
# No restore, DDL, roles/password rotation, source, Stripe, hosting or production.
# GitHub schedules may be delayed/omitted; independent freshness remains required.
