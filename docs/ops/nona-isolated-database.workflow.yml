# INERT TEMPLATE. Do not install in the public application repository.
# Requires separate approval/access in PRIVATE NONA-OPS and a hard $0 budget.
name: Nona isolated TEST database and Auth backup
on:
  schedule:
    - cron: '11 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-test-database-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.event.repository.private == true && vars.NONA_ISOLATED_OPS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: nona-isolated-test
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tpenalba06/HOSTBUDDY
          ref: 33789ae11603d603c8b93d0b7eb21ef5359ea81e
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tools before private inputs
        run: |
          python -m pip install -r scripts/ops/requirements.txt
          python scripts/ops/test-database-backup.py
          python - <<'PY'
          import importlib.util
          s = importlib.util.spec_from_file_location('database_backup', 'scripts/ops/database-backup.py')
          m = importlib.util.module_from_spec(s)
          s.loader.exec_module(m)
          try:
              m.clients()
          except Exception:
              raise SystemExit('PostgreSQL 17+ clients required before activation') from None
          print('PostgreSQL clients PASS')
          PY
      - name: Prepare approved PostgreSQL TEST input only
        env:
          NONA_TEST_DATABASE_JSON: ${{ secrets.NONA_TEST_DATABASE_JSON }}
          NONA_TEST_BACKUP_KEY_HEX: ${{ secrets.NONA_TEST_BACKUP_KEY_HEX }}
        run: |
          python - <<'PY'
          import os, pathlib
          private = pathlib.Path(os.environ['RUNNER_TEMP']) / 'nona-database-private'
          private.mkdir(mode=0o700)
          for name, variable in [('database.json','NONA_TEST_DATABASE_JSON'), ('backup.key','NONA_TEST_BACKUP_KEY_HEX')]:
              value = os.environ.get(variable, '')
              if not value: raise SystemExit('Missing approved TEST input')
              fd = os.open(private / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(fd, 'w') as f: f.write(value)
          PY
      - name: Read-only logical export and authenticated recheck
        run: |
          python scripts/ops/database-backup.py backup --expected-ref mhhtnqfdkyudwyqlmnce --connection-file "$RUNNER_TEMP/nona-database-private/database.json" --key-file "$RUNNER_TEMP/nona-database-private/backup.key" --output "$RUNNER_TEMP/nona-database-private/database.nonaenc" --max-bytes 67108864
          python scripts/ops/database-backup.py verify --expected-ref mhhtnqfdkyudwyqlmnce --key-file "$RUNNER_TEMP/nona-database-private/backup.key" --output "$RUNNER_TEMP/nona-database-private/database.nonaenc"
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-test-database-${{ github.run_id }}
          path: ${{ runner.temp }}/nona-database-private/database.nonaenc
          retention-days: 7
          if-no-files-found: error
      - name: Remove only this job private inputs
        if: always()
        run: |
          python - <<'PY'
          import os, pathlib
          private = pathlib.Path(os.environ['RUNNER_TEMP']) / 'nona-database-private'
          for name in ['database.json', 'backup.key']:
              (private / name).unlink(missing_ok=True)
          PY
# Only ciphertext is uploaded, after successful export and separate verification.
# No restore, DDL, roles/password rotation, source, Stripe, hosting or production.
# GitHub schedules may be delayed/omitted; independent freshness remains required.
